<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Chrome Bridge</title>
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1>Chrome Bridge</h1>
          <p id="summary">状態を確認しています</p>
        </div>
        <span id="statusDot" class="status-dot status-checking" aria-hidden="true"></span>
      </header>

      <dl class="status-list">
        <div>
          <dt>Bridge</dt>
          <dd id="daemonStatus">確認中</dd>
        </div>
        <div>
          <dt>Extension</dt>
          <dd id="extensionStatus">確認中</dd>
        </div>
        <div>
          <dt>Active tab</dt>
          <dd id="tabStatus">確認中</dd>
        </div>
      </dl>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
